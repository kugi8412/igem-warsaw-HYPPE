name: hyppe
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytest
  - ruff
  - pip:
      # torch is installed from the PyTorch index because the CUDA build
      # matters and conda-forge does not carry the +cuXXX variants.
      # Check:
      # torch.cuda.is_available() before trusting a training run.
      #   --index-url https://download.pytorch.org/whl/cu126
      - torch==2.10.0
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.15.3
      - scikit-learn==1.7.0
      - PyYAML==6.0.2
      - matplotlib==3.10.1
      - tqdm==4.67.3
      - biopython==1.85
      # Only to REBUILD the text-embedding caches; not needed to train.
      # - transformers==5.10.2
      - -e .
